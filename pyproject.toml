[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ehr-media-intelligence"
version = "0.1.0"
description = "AI-powered EHR media intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.9.1",
    "fhir.resources==8.0.0",
    "anthropic==1.17.0",
    "openai==1.75.0",
    "chromadb==0.5.23",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.0",
    "aiosqlite==0.21.0",
    "sqlalchemy==2.0.41",
    "pandas==2.2.3",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-cov==6.1.0",
    "httpx==0.28.1",
    "ruff==0.11.9",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
